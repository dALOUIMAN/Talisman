# NoxCore Configuration
# Based on Alpine Linux philosophy - lightweight and efficient

noxcore:
  version: "1.0.0-alpine"
  
  # Base distribution
  distribution:
    base: "alpine"
    philosophy: "lightweight, efficient, secure"
  
  # Console settings
  console:
    enabled: true
    port: 3000
    visual_mode: "efficient"
    emergency_channel: true
    chat_window: true
    
  # Protocol settings
  protocols:
    communication: "noxcore-protocol"
    version: "1.0.0"
    message_format: "json"
    
  # Resource management
  resources:
    optimization: "nanolevel"
    local_first: true
    tribe_leaders:
      enabled: true
      auto_connect: false
      
  # Hive integration
  hive:
    enabled: true
    coordinator_required: true
    min_workers: 1
    max_workers: 10
    
  # Agent settings
  agents:
    ai_focused: true
    human_interaction: "minimal"
    tools_projection: "dynamic"
    
  # Security
  security:
    safe_room: true
    isolated_network: true
    api_auth: true
    
  # Performance
  performance:
    gpu_support: true
    cuda_enabled: true
    memory_optimization: true
    
  # Development
  development:
    lab_toolbox: true
    testing: "continuous"
    deployment: "flexible"
