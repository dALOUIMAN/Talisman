# NoxCore Agent Zero Configuration
# Hive coordination and agent settings

hive:
  name: "NoxCore Agent Hive"
  max_agents: 10
  auto_scaling: true
  
coordinator:
  enabled: true
  heartbeat_interval: 60
  task_timeout: 300
  
agents:
  worker:
    min_instances: 3
    max_instances: 10
    resources:
      memory_mb: 256
      cpu_percent: 50
  
communication:
  protocol: redis
  message_format: json
  retry_attempts: 3
  
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
performance:
  lightweight_mode: true
  gpu_support: false
  cuda_support: false
